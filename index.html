<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7a4bdd">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" type="image/png" href="sayangsirah.png">
  <link rel="apple-touch-icon" href="sayangsirah.png">
  <title>Sayang Sirah</title>
  <style>
    :root{--ink:#3f3156;--purple:#7652d1;--pink:#ff7096;--yellow:#ffd75e;--mint:#66d7bd;--cream:#fffaf0;--shadow:0 8px 0 rgba(77,49,108,.13),0 15px 30px rgba(77,49,108,.12)}
    *{box-sizing:border-box} body{margin:0;min-height:100dvh;color:var(--ink);font-family:Nunito,"Arial Rounded MT Bold",Arial,sans-serif;background:linear-gradient(160deg,#f6edff 0%,#e5f8ff 52%,#fff1c8 100%);overflow-x:hidden}
    button{font:inherit;cursor:pointer;border:0} .cloud{position:fixed;z-index:-1;border-radius:999px;background:#fff;opacity:.75;filter:drop-shadow(0 5px 4px #c5d3e755)}.cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%}.cloud:before{width:58%;height:130%;left:17%;top:-48%}.cloud:after{width:43%;height:100%;right:10%;top:-29%}.c1{width:150px;height:40px;top:9%;left:3%}.c2{width:220px;height:55px;top:22%;right:-45px}.c3{width:120px;height:32px;bottom:13%;left:8%}
    .app{width:min(100%,900px);margin:auto;padding:clamp(15px,3vw,30px) clamp(14px,4vw,38px) 26px;min-height:100dvh;display:flex;flex-direction:column}.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.logo{display:flex;align-items:center;gap:10px;font-weight:1000;font-size:clamp(1.15rem,4vw,1.55rem);letter-spacing:-.5px}.logo-mark{width:45px;height:45px;border-radius:17px;background:linear-gradient(135deg,#ffd75e,#ffab5e);display:grid;place-items:center;font-size:26px;box-shadow:0 5px 0 #e99c50}.home{background:white;color:var(--purple);border-radius:999px;padding:10px 15px;font-weight:900;box-shadow:0 4px 0 #d6c8ee}.screen{display:none;flex:1}.screen.active{display:flex;flex-direction:column}.hero{justify-content:center;align-items:center;text-align:center;min-height:74dvh}.mascot{position:relative;width:clamp(185px,48vw,255px);aspect-ratio:1;margin-bottom:20px;filter:drop-shadow(0 12px 5px #76609a29)}.star{position:absolute;color:#ffcc3f;font-size:30px;animation:twinkle 1.8s infinite alternate}.s1{top:10px;left:12px}.s2{right:2px;top:50px;animation-delay:.6s}.s3{bottom:7px;left:10px;animation-delay:1s}.head{position:absolute;inset:20% 15% 8%;border-radius:47% 47% 43% 43%;background:#c7875e;border:5px solid #49334c;z-index:2}.hair{position:absolute;z-index:3;background:#49334c;width:72%;height:42%;left:14%;top:14%;border-radius:50% 50% 35% 35%}.hair:after{content:"";position:absolute;width:23%;height:70%;right:-5%;top:12%;background:#49334c;border-radius:50%}.face{position:absolute;z-index:4;top:43%;left:29%;width:43%;height:30%}.eye{position:absolute;top:19%;width:11px;height:15px;border-radius:50%;background:#34283a}.eye:after{content:"";position:absolute;width:4px;height:4px;border-radius:50%;background:white;top:2px;left:2px}.e1{left:10%}.e2{right:10%}.smile{position:absolute;width:29%;height:20%;bottom:5%;left:36%;border-bottom:4px solid #34283a;border-radius:0 0 50% 50%}.body{position:absolute;z-index:1;bottom:0;left:11%;width:78%;height:42%;background:linear-gradient(90deg,#8459dc,#a671e8);border:5px solid #49334c;border-radius:48% 48% 23% 23%}.book{position:absolute;z-index:5;bottom:4%;left:21%;width:60%;height:34%;border:4px solid #49334c;border-radius:5px;background:#ffdd5d;transform:rotate(-7deg)}.book:before{content:"☪";font-size:43px;position:absolute;inset:8px;color:#7652d1}.hero h1{font-size:clamp(2.2rem,8vw,4.4rem);line-height:.95;margin:0 0 24px;font-weight:1000;letter-spacing:-2px}.hero h1 span{display:block;color:var(--purple)}.start{font-size:clamp(1.15rem,4vw,1.4rem);font-weight:1000;color:white;background:linear-gradient(180deg,#ff829f,#f75481);padding:18px 44px;border-radius:22px;box-shadow:0 7px 0 #ce3f67,0 12px 17px #da608058;transition:.15s}.start:active{transform:translateY(5px);box-shadow:0 2px 0 #ce3f67}.tiny{font-size:.78rem;font-weight:800;opacity:.6;margin-top:21px}
    .game-head{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin:6px 0 13px}.progress-copy{font-size:.85rem;font-weight:1000;color:#66547a}.bar{grid-column:1/-1;height:15px;border-radius:99px;background:#ded5ec;overflow:hidden;box-shadow:inset 0 2px 3px #8d7ba52a}.bar i{display:block;width:0%;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--mint),#5ca9df);transition:width .4s}.score-pill{padding:9px 12px;border-radius:15px;background:#fff;color:#e75e7e;font-size:.82rem;font-weight:1000;box-shadow:0 4px 0 #e9dce6}.question-card{position:relative;background:rgba(255,255,255,.91);border:3px solid white;border-radius:28px;padding:clamp(18px,4vw,29px);box-shadow:var(--shadow);flex:1}.badge{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:99px;background:#eee4ff;color:#7350b9;font-size:.76rem;font-weight:1000}.question{font-weight:1000;font-size:clamp(1.25rem,4.3vw,1.75rem);line-height:1.15;margin:16px 0 20px}.instruction{font-size:.87rem;font-weight:900;color:#806f92;margin:-8px 0 16px}.boards{display:grid;gap:12px}.match-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center}.prompt,.drop{border-radius:17px;min-height:59px;padding:12px;display:flex;align-items:center;font-weight:1000}.prompt{background:#fff6cf;border:2px solid #ffe08b}.drop{background:#faf8ff;border:3px dashed #bdaee1;justify-content:center;text-align:center;color:#8a7aa6;transition:.2s}.drop.over{background:#e4f9f3;border-color:var(--mint);transform:scale(1.02)}.drop.filled{border-style:solid;background:#f4efff;color:#514064}.drop.correct{background:#e0f9ed;border-color:#53cba7;color:#246653}.drop.wrong{background:#ffe2e9;border-color:#ff7b9c;color:#a03a55}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;margin-top:18px}.option{user-select:none;touch-action:none;background:linear-gradient(180deg,#fff,#f3effc);border:2px solid #e1d9f0;border-radius:17px;padding:13px 10px;min-height:56px;display:flex;align-items:center;justify-content:center;text-align:center;color:#514064;font-weight:1000;box-shadow:0 4px 0 #d9d0e9;transition:.15s}.option:hover{transform:translateY(-2px)}.option.dragging{opacity:.4;transform:scale(.96)}.option.used{visibility:hidden}.feedback{min-height:24px;text-align:center;margin:13px 0 0;font-weight:1000}.next{float:right;margin-top:12px;padding:12px 18px;background:var(--purple);color:white;font-weight:1000;border-radius:14px;box-shadow:0 4px 0 #553ba3}.next[hidden]{display:none}.result{justify-content:center;align-items:center;text-align:center}.result-card{background:#fff;border:3px solid #fff;border-radius:31px;padding:30px 20px;max-width:520px;box-shadow:var(--shadow)}.trophy{font-size:77px;filter:drop-shadow(0 7px 0 #e8c65a)}.result h2{font-size:clamp(1.75rem,6vw,2.5rem);margin:8px 0}.percent{font-size:clamp(4.2rem,16vw,6rem);font-weight:1000;color:var(--purple);line-height:1}.result p{font-weight:800;line-height:1.45}.again{margin-top:9px;padding:16px 29px;border-radius:18px;background:var(--pink);color:#fff;font-weight:1000;box-shadow:0 5px 0 #ce3f67}.footer{text-align:center;font-size:.73rem;font-weight:800;opacity:.55;margin-top:17px}.confetti{position:fixed;z-index:20;width:10px;height:16px;top:-30px;pointer-events:none;animation:fall 1.6s ease-in forwards}@keyframes fall{to{transform:translate(var(--x),110dvh) rotate(720deg);opacity:0}}@keyframes twinkle{to{transform:scale(1.35) rotate(15deg);opacity:.6}}@media(max-width:420px){.brand{margin-bottom:8px}.home{padding:8px 11px;font-size:.8rem}.question-card{border-radius:23px}.match-row{gap:7px}.prompt,.drop{min-height:53px;padding:9px;font-size:.9rem}.options{grid-template-columns:1fr 1fr}.option{font-size:.88rem;padding:10px 7px}}
  </style>
</head>
<body>
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
  <main class="app">
    <header class="brand"><div class="logo"><span class="logo-mark">★</span> Sayang Sirah</div><button class="home" id="homeBtn" hidden>⌂ Mula</button></header>
    <section class="screen hero active" id="welcome"><div class="mascot"><span class="star s1">✦</span><span class="star s2">✦</span><span class="star s3">✦</span><div class="body"></div><div class="head"></div><div class="hair"></div><div class="face"><i class="eye e1"></i><i class="eye e2"></i><i class="smile"></i></div><div class="book"></div></div><h1>Jom <span>Sayang Sirah!</span></h1><button class="start" id="startBtn">MULAKAN</button><div class="tiny">10 soalan • seret & padan</div></section>
    <section class="screen" id="game"><div class="game-head"><div class="progress-copy" id="progress">Soalan 1 daripada 10</div><div class="score-pill" id="score">★ 0 tepat</div><div class="bar"><i id="bar"></i></div></div><div class="question-card"><span class="badge" id="topic">Tahun 1 • Sirah</span><h2 class="question" id="question"></h2><p class="instruction" id="instruction">Seret jawapan ke tempat yang betul.</p><div class="boards" id="boards"></div><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="next" id="next" hidden>Seterusnya →</button></div></section>
    <section class="screen result" id="result"><div class="result-card"><div class="trophy">🏆</div><h2>Hebat, sahabat!</h2><div class="percent" id="percent">100%</div><p id="resultText"></p><button class="again" id="again">CUBA LAGI</button></div></section>
    <footer class="footer">© 2026 Ridzuan Atan. Sayang Sirah.</footer>
  </main>
<script>
/* Bank soalan merangkumi fokus Sirah DSKP KSSR Semakan: Tahun 1 (kelahiran, siddiq, keluarga) dan Tahun 2 (kenabian, amanah, sahabat). */
const bank=[
{y:1,t:'Kelahiran Nabi',q:'Padankan ahli keluarga Nabi Muhammad SAW.',pairs:[['Bapa Nabi','Abdullah bin Abdul Muttalib'],['Ibu Nabi','Aminah binti Wahab']]},
{y:1,t:'Kelahiran Nabi',q:'Padankan tokoh dengan peranannya dalam kisah Nabi ketika kecil.',pairs:[['Datuk Nabi','Abdul Muttalib'],['Ibu susuan Nabi','Halimatus Saadiah']]},
{y:1,t:'Kelahiran Nabi',q:'Pilih jawapan yang melengkapkan ayat ini.',single:['Nabi Muhammad SAW dilahirkan di…','Makkah','Madinah','Taif']},
{y:1,t:'Kelahiran Nabi',q:'Pilih peristiwa yang berlaku semasa Nabi Muhammad SAW kecil.',single:['Siapakah yang menyusukan Nabi Muhammad SAW?','Halimatus Saadiah','Aisyah RA','Fatimah RA']},
{y:1,t:'Sifat Siddiq',q:'Padankan sifat dengan maksudnya.',pairs:[['Siddiq','Benar'],['Amanah','Boleh dipercayai']]},
{y:1,t:'Sifat Siddiq',q:'Pilih tindakan yang menunjukkan sifat siddiq.',single:['Apakah yang patut dilakukan apabila kita terjumpa pensel kawan?','Pulangkan kepada pemilik','Simpan diam-diam','Sembunyikan']},
{y:1,t:'Sifat Siddiq',q:'Padankan situasi dengan tindakan yang betul.',pairs:[['Tersilap memecahkan barang','Berterus terang'],['Berjanji dengan ibu','Menunaikan janji']]},
{y:1,t:'Sifat Siddiq',q:'Pilih contoh perbuatan benar.',single:['Semasa guru bertanya siapa yang menumpahkan air, saya…','mengaku dengan jujur','menuduh kawan','melarikan diri']},
{y:1,t:'Keluarga Nabi',q:'Padankan ahli keluarga Nabi Muhammad SAW.',pairs:[['Isteri pertama Nabi','Khadijah binti Khuwailid'],['Anak perempuan Nabi','Fatimah']]},
{y:1,t:'Keluarga Nabi',q:'Pilih sikap Nabi Muhammad SAW dalam keluarga.',single:['Nabi Muhammad SAW sentiasa…','menyayangi keluarga','menyakiti keluarga','mengabaikan keluarga']},
{y:1,t:'Keluarga Nabi',q:'Padankan amalan keluarga dengan nilai baik.',pairs:[['Membantu ibu bapa','Berbakti'],['Bercakap lembut','Menghormati']]},
{y:1,t:'Keluarga Nabi',q:'Pilih tindakan yang mencontohi kasih sayang Nabi terhadap keluarga.',single:['Apakah tindakan yang baik di rumah?','Membantu mengemas','Membiarkan kerja ibu','Bercakap kasar']},
{y:2,t:'Tanda Kenabian',q:'Padankan peristiwa dengan keterangan yang betul.',pairs:[['Malaikat membelah dada Nabi','Berlaku ketika Nabi kecil'],['Dada Nabi disucikan','Tanda penjagaan Allah']]},
{y:2,t:'Tanda Kenabian',q:'Pilih iktibar daripada peristiwa dada Nabi disucikan.',single:['Kita hendaklah menjaga…','kebersihan hati dan akhlak','sifat sombong','perasaan dengki']},
{y:2,t:'Tanda Kenabian',q:'Padankan tindakan dengan iktibar yang sesuai.',pairs:[['Memaafkan kawan','Hati yang baik'],['Menjauhi dengki','Akhlak terpuji']]},
{y:2,t:'Tanda Kenabian',q:'Pilih jawapan yang betul.',single:['Siapakah yang membelah dada Nabi Muhammad SAW dengan izin Allah?','Malaikat Jibril','Abu Talib','Abdul Muttalib']},
{y:2,t:'Nabi Muhammad al-Amin',q:'Padankan gelaran dengan maksudnya.',pairs:[['Al-Amin','Yang dipercayai'],['Amanah','Menjaga kepercayaan']]},
{y:2,t:'Nabi Muhammad al-Amin',q:'Pilih cara menjaga amanah.',single:['Kawan meminjamkan buku kepada kita. Kita perlu…','menjaganya dengan baik','mengoyakkannya','menyembunyikannya']},
{y:2,t:'Nabi Muhammad al-Amin',q:'Padankan situasi dengan sifat Nabi.',pairs:[['Memulangkan barang pinjaman','Amanah'],['Bercakap perkara sebenar','Jujur']]},
{y:2,t:'Nabi Muhammad al-Amin',q:'Pilih tindakan amanah di sekolah.',single:['Jika dilantik sebagai ketua kelas, saya…','menjalankan tugas dengan baik','mengabaikan tugasan','mengganggu rakan']},
{y:2,t:'Nabi Muhammad al-Amin',q:'Pilih sebab Nabi Muhammad SAW digelar al-Amin.',single:['Baginda terkenal kerana…','sangat amanah','suka memungkiri janji','tidak jujur']},
{y:2,t:'Sahabat Sejati',q:'Padankan sahabat Nabi dengan kategori mereka.',pairs:[['Abu Bakar as-Siddiq','Sahabat lelaki'],['Khadijah binti Khuwailid','Sahabat perempuan']]},
{y:2,t:'Sahabat Sejati',q:'Padankan sahabat Nabi dengan kategori mereka.',pairs:[['Ali bin Abi Talib','Sahabat kanak-kanak'],['Bilal bin Rabah','Sahabat hamba yang dimerdekakan']]},
{y:2,t:'Sahabat Sejati',q:'Pilih sikap sahabat sejati.',single:['Sahabat yang baik akan…','menolong ketika perlu','mengejek kawan','mengajak buat salah']},
{y:2,t:'Sahabat Sejati',q:'Padankan perlakuan dengan nilai persahabatan.',pairs:[['Mendengar masalah kawan','Prihatin'],['Berkongsi alat tulis','Suka membantu']]},
{y:2,t:'Sahabat Sejati',q:'Pilih contoh akhlak Nabi dalam bersahabat.',single:['Nabi Muhammad SAW melayan sahabat dengan…','baik dan hormat','kasar','sombong']},
{y:2,t:'Sahabat Sejati',q:'Pilih tindakan apabila kawan melakukan kesilapan.',single:['Saya menegur kawan dengan…','lembut dan baik','marah-marah','ejekan']},
{y:2,t:'Sahabat Sejati',q:'Padankan tokoh dengan fakta ringkas.',pairs:[['Abu Bakar as-Siddiq','Sahabat yang sangat setia'],['Ali bin Abi Talib','Sepupu Nabi Muhammad SAW']]},
{y:1,t:'Ulangkaji Tahun 1',q:'Padankan perkara sirah dengan pengajarannya.',pairs:[['Siddiq Nabi','Sentiasa berkata benar'],['Keluarga Nabi','Disayangi dan dihormati']]},
{y:2,t:'Ulangkaji Tahun 2',q:'Padankan perkara sirah dengan pengajarannya.',pairs:[['Al-Amin','Jaga amanah'],['Sahabat sejati','Berbuat baik kepada kawan']]},
{y:1,t:'Ulangkaji Tahun 1',q:'Pilih tindakan yang menunjukkan akhlak Nabi.',single:['Apabila berjanji, saya…','menepatinya','melupakannya','memungkiri']},
{y:2,t:'Ulangkaji Tahun 2',q:'Pilih nilai yang patut diamalkan setiap hari.',single:['Nilai yang dicontohi daripada Nabi Muhammad SAW ialah…','jujur dan amanah','malas dan sombong','dengki dan marah']}
];
const $=s=>document.querySelector(s), shuffle=a=>[...a].sort(()=>Math.random()-.5); let cycle=[],idx=0,correct=0,selected=null,locked=false;
function newCycle(){let bag=JSON.parse(localStorage.getItem('sayangSirahBag')||'[]');if(bag.length<10)bag=shuffle(bank.map((_,i)=>i));cycle=bag.splice(0,10).map(i=>bank[i]);localStorage.setItem('sayangSirahBag',JSON.stringify(bag));idx=0;correct=0;show('game');render()}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===id));$('#homeBtn').hidden=id==='welcome'}
function render(){locked=false;selected=null;let d=cycle[idx];$('#progress').textContent=`Soalan ${idx+1} daripada 10`;$('#score').textContent=`★ ${correct} tepat`;$('#bar').style.width=`${idx*10}%`;$('#topic').textContent=`Tahun ${d.y} • ${d.t}`;$('#question').textContent=d.q;$('#feedback').textContent='';$('#next').hidden=true;const boards=$('#boards'),opts=$('#options');boards.innerHTML='';opts.innerHTML=''; if(d.pairs){$('#instruction').textContent='Seret jawapan, atau ketuk jawapan kemudian ketuk ruang padanan.';let answers=[];d.pairs.forEach((p,i)=>{answers.push({text:p[1],key:i});let row=document.createElement('div');row.className='match-row';row.innerHTML=`<div class="prompt">${p[0]}</div><div class="drop" data-key="${i}">Letak jawapan di sini</div>`;boards.append(row)});makeOptions(shuffle(answers),opts)}else{$('#instruction').textContent='Seret jawapan yang betul ke dalam kotak.';let [label,ans,...wrong]=d.single;boards.innerHTML=`<div class="drop" data-key="0">${label}<br><small>Letak jawapan di sini</small></div>`;makeOptions(shuffle([{text:ans,key:0},...wrong.map(x=>({text:x,key:-1}))]),opts)}}
function makeOptions(items,holder){items.forEach((x,i)=>{let o=document.createElement('div');o.className='option';o.draggable=true;o.tabIndex=0;o.textContent=x.text;o.dataset.key=x.key;o.id='answer-'+idx+'-'+i;o.addEventListener('dragstart',e=>{if(locked)return;e.dataTransfer.setData('text/plain',o.id);o.classList.add('dragging')});o.addEventListener('dragend',()=>o.classList.remove('dragging'));o.addEventListener('click',()=>choose(o));holder.append(o)});document.querySelectorAll('.drop').forEach(drop=>{drop.addEventListener('dragover',e=>{if(!locked){e.preventDefault();drop.classList.add('over')}});drop.addEventListener('dragleave',()=>drop.classList.remove('over'));drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over');place(document.getElementById(e.dataTransfer.getData('text/plain')),drop)});drop.addEventListener('click',()=>{if(selected)place(selected,drop)})})}
function choose(o){if(locked||o.classList.contains('used'))return;document.querySelectorAll('.option').forEach(x=>x.style.outline='');selected=o;o.style.outline='3px solid #ff7096';$('#feedback').textContent='Sekarang ketuk ruang jawapan.'}
function place(o,drop){if(!o||locked||drop.classList.contains('filled'))return;let expected=+drop.dataset.key, got=+o.dataset.key;drop.textContent=o.textContent;drop.classList.add('filled');o.classList.add('used');o.style.outline='';selected=null;if(got===expected){drop.classList.add('correct');let all=[...document.querySelectorAll('.drop')];if(all.every(x=>x.classList.contains('filled'))){win()}}else{drop.classList.add('wrong');locked=true;$('#feedback').textContent='Belum tepat. Cuba soalan seterusnya ya!';$('#next').hidden=false}}
function win(){locked=true;correct++;$('#score').textContent=`★ ${correct} tepat`;$('#feedback').textContent='Bagus! Jawapan kamu betul! ✨';confetti();$('#next').hidden=false}
function confetti(){let colors=['#ff7096','#ffd75e','#66d7bd','#7652d1','#64b5f6'];for(let i=0;i<70;i++){let c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=colors[i%colors.length];c.style.setProperty('--x',(Math.random()*180-90)+'px');c.style.animationDelay=Math.random()*.25+'s';document.body.append(c);setTimeout(()=>c.remove(),2100)}}
function next(){idx++;if(idx>=10){$('#bar').style.width='100%';$('#percent').textContent=`${correct*10}%`;$('#resultText').textContent=correct===10?'Masya-Allah! Kamu sudah menguasai pusingan ini.':'Teruskan berlatih. Set soalan baharu akan muncul pada pusingan seterusnya!';show('result')}else render()}
$('#startBtn').onclick=newCycle;$('#again').onclick=newCycle;$('#next').onclick=next;$('#homeBtn').onclick=()=>show('welcome');
</script>
</body></html>
